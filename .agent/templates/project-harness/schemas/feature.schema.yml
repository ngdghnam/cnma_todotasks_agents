$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Feature"
type: object
required: [id, title, status, source_refs]
properties:
  id:
    type: string
    pattern: "^FEAT-[0-9]{3,}$"
  title:
    type: string
  description:
    type: string
  status:
    type: string
    enum: ["proposed", "accepted", "in-progress", "delivered", "obsolete"]
    description: "Only `accepted` (or later) features may be developed (gate: before_development)."
  source_refs:
    type: array
    minItems: 1
    items:
      type: string
    description: "Required (anti-fiction) — must point to a real requirement / discovery doc."
  linked_requirements:
    type: array
    items:
      type: string
      pattern: "^REQ-[0-9]{3,}$"
  linked_user_stories:
    type: array
    items: { type: string }
  owner:
    type: string
  notes:
    type: string
