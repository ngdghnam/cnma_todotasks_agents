$schema: "https://json-schema.org/draft/2020-12/schema"
title: "User Story"
type: object
required: [id, title, status, linked_feature, source_refs, acceptance_criteria]
properties:
  id:
    type: string
    pattern: "^US-[0-9]{3,}$"
  title:
    type: string
  as_a:
    type: string
  i_want:
    type: string
  so_that:
    type: string
  status:
    type: string
    enum: ["proposed", "ready", "in-progress", "done", "obsolete"]
  linked_feature:
    type: string
    pattern: "^FEAT-[0-9]{3,}$"
    description: "Must link to an accepted feature (gate: before_development)."
  source_refs:
    type: array
    minItems: 1
    items: { type: string }
  acceptance_criteria:
    type: array
    minItems: 1
    items: { type: string }
  priority:
    type: string
  estimate:
    type: string
