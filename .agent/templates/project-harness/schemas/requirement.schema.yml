$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Requirement"
type: object
required: [id, title, status, source_refs]
properties:
  id:
    type: string
    pattern: "^REQ-[0-9]{3,}$"
  title:
    type: string
  description:
    type: string
  priority:
    type: string
    enum: ["Must", "Should", "Could", "Won't"]
  status:
    type: string
    enum: ["proposed", "accepted", "in-review", "approved", "obsolete"]
  source_refs:
    type: array
    minItems: 1
    items:
      type: string
    description: "Repository paths or external references that justify the requirement. Required (anti-fiction)."
  linked_features:
    type: array
    items: { type: string }
  linked_user_stories:
    type: array
    items: { type: string }
  acceptance_criteria:
    type: array
    items: { type: string }
