$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Execution Plan"
type: object
required: [id, title, status, linked_task, goal, plan, validation_plan, completion_criteria]
properties:
  id:
    type: string
    pattern: "^EP-[0-9]{3,}$"
  title:
    type: string
  status:
    type: string
    enum: ["active", "completed", "abandoned"]
  linked_task:
    type: string
    pattern: "^TASK-[0-9]{4,}$"
  linked_feature:
    type: string
  linked_user_story:
    type: string
  linked_requirement:
    type: string
  linked_sprint:
    type: string
  goal:
    type: string
  context:
    type: string
  scope:
    type: object
    properties:
      in_scope:
        type: array
        items: { type: string }
      out_of_scope:
        type: array
        items: { type: string }
  plan:
    type: array
    minItems: 1
    items: { type: string }
  files_expected_to_change:
    type: array
    items:
      type: object
      required: [path, change]
      properties:
        path: { type: string }
        change: { type: string }
  validation_plan:
    type: array
    minItems: 1
    items:
      type: object
      required: [check, method, expected]
      properties:
        check: { type: string }
        method: { type: string }
        expected: { type: string }
  documentation_updates_required:
    type: array
    items: { type: string }
  risks:
    type: array
    items: { type: string }
  completion_criteria:
    type: array
    minItems: 1
    items: { type: string }
