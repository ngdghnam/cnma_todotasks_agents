schema_version: "1.0"
agent:
  id: cap-implementation
  display_name: Forge
  version: 0.1.0
  status: experimental
  owner: AI Engineering
  functional_role: CAP/BTP Implementation Engineer
  governed_role: Developer
  description: Scoped CAP/BTP implementation, technical testing, and self-review.
instructions: .agent/agents/harness/agents/forge/agent.md
shared_context:
  - .agent/agents/harness/shared/cap-btp-mindset.md
  - .agent/agents/harness/shared/execution-context-contract.md
capabilities:
  - cap-model-implementation
  - cap-service-implementation
  - react-implementation
  - technical-testing
  - self-review
supported_states: [implement, self-review, unit-test]
skills:
  - .agent/agents/harness/skills/cap-implementation.md
contracts:
  input: .agent/agents/harness/schemas/execution-context.schema.json
  output: .agent/agents/harness/schemas/agent-result.schema.json
  completion:
    implement: .agent/agents/harness/contracts/states/implement-completion.yml
    self-review: .agent/agents/harness/contracts/states/self-review-completion.yml
    unit-test: .agent/agents/harness/contracts/states/unit-test-completion.yml
tools:
  allow: [filesystem.read, filesystem.write.scoped, repository.search, terminal.scoped, git.diff]
  deny: [filesystem.write.baseline, filesystem.write.agent_kit, lifecycle.apply, transition.confirm]
memory:
  project: read-only-through-context
  execution: read-write
  private_persistent: denied
runtime:
  enforcement_mode: manual-audited
  max_attempts: 2
  sandbox_profile: scoped-project-write
  concurrent_for_same_target: false
  require_scope_check: true
  budgets:
    enforcement: observe
    max_tool_calls: 120
    max_iterations: 30
loop:
  strategy: evidence-driven
  progress_schema: .agent/agents/harness/schemas/progress-ledger.schema.json
  max_no_progress_iterations: 2
  hard_iteration_limit: 60
  continue_when: [incomplete_work_exists, progress_was_made, no_blocker_exists]
  stop_when: [completion_predicate_satisfied, blocker_detected, no_progress_limit_reached, hard_iteration_limit_reached]
observability:
  emit: [agent.started, context.loaded, iteration.started, tool.called, artifact.changed, validation.completed, progress.updated, completion.evaluated, permission.denied, agent.completed, agent.blocked]
governance:
  may_modify_project: true
  modification_requires_runtime_allowlist: true
  may_propose_transition: true
  may_apply_transition: false

