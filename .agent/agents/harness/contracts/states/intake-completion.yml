schema_version: "1.0"
contract_id: intake-completion
state: intake
objective: Capture an evidence-backed functional intake without inventing scope.
success_policy: all-required-checks-pass
required_checks:
  - { id: BA-INTAKE-CONTEXT, description: "Linked feature, stories, requirements, and relevant decisions were resolved.", evidence_required: true }
  - { id: BA-INTAKE-SCOPE, description: "Functional scope, exclusions, actors, and material dependencies are recorded.", evidence_required: true }
  - { id: BA-INTAKE-QUESTIONS, description: Material ambiguities are resolved or recorded as governed clarifications., evidence_required: true }
allowed_termination: [COMPLETED, COMPLETED_WITH_WARNINGS, BLOCKED, FAILED]
warning_policy: Warnings may not hide a material scope or acceptance ambiguity.

