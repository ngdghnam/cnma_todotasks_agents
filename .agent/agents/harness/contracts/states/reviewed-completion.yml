schema_version: "1.0"
contract_id: reviewed-completion
state: reviewed
objective: Reconcile review evidence and prepare the governed build-readiness boundary.
success_policy: all-required-checks-pass
required_checks:
  - { id: BA-REVIEW-FINDINGS, description: Substantive review findings are resolved or explicitly governed., evidence_required: true }
  - { id: BA-REVIEW-READINESS, description: "Acceptance criteria and functional scope are complete and testable for build readiness.", evidence_required: true }
  - { id: BA-REVIEW-BOUNDARY, description: Baseline and BA-to-DEV handoff inputs are prepared without writing the protected official artifacts., evidence_required: true }
allowed_termination: [COMPLETED, COMPLETED_WITH_WARNINGS, BLOCKED, FAILED]
warning_policy: Warnings may not bypass the freeze or BA-to-DEV handoff gate.

