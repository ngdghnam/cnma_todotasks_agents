schema_version: "1.0"
contract_id: verify-completion
state: verify
objective: Independently verify implementation scope, behavior, quality, and evidence for the Harness gate.
success_policy: all-required-checks-pass
required_checks:
  - id: VERIFY-SCOPE
    description: Claimed changes, live diff, effective permission scope, and implementation result reconcile.
    evidence_required: true
  - id: VERIFY-TRACE
    description: Supplied acceptance criteria and work items have implementation and test evidence.
    evidence_required: true
  - id: VERIFY-CAP
    description: Applicable CAP data/service/action, transaction, authorization, validation, integration, and UI risks are independently reviewed.
    evidence_required: true
  - id: VERIFY-EVIDENCE
    description: Required commands and artifacts are independently inspected or rerun with factual outcomes.
    evidence_required: true
  - id: VERIFY-FINDINGS
    description: All findings have severity, location, evidence, risk, and required action; no blocking finding is unresolved for COMPLETED.
    evidence_required: true
allowed_termination: [COMPLETED, COMPLETED_WITH_WARNINGS, BLOCKED, FAILED]
warning_policy: COMPLETED_WITH_WARNINGS requires Harness warning disposition before any transition proposal.

